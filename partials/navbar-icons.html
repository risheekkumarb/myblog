};

const navbarIcon = (name) => {
  return `<svg class="dq-navbar-icon dq-navbar-icon-${name}" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="${navbarIcons[name]}"></path></svg>`;
};

const initializeNavbarIcons = () => {
  const themeToggle = document.querySelector(".quarto-color-scheme-toggle");
  const menuIcon = document.querySelector(".navbar-toggler-icon");
  const search = document.querySelector("#quarto-search");

  const updateThemeIcon = () => {
    if (!themeToggle) return;

    const preference = window.localStorage.getItem("quarto-color-scheme");
    const theme = preference === null
      ? "system"
      : themeToggle.classList.contains("alternate") ? "dark" : "light";

    themeToggle.innerHTML = `<span class="visually-hidden">Toggle color scheme</span>${navbarIcon(theme)}`;
  };

  if (themeToggle) {
    updateThemeIcon();
    themeToggle.addEventListener("click", () => window.requestAnimationFrame(updateThemeIcon));
  }

  if (menuIcon) {
    menuIcon.innerHTML = navbarIcon("menu");
  }

  const updateSearchIcon = () => {
    const holder = search?.querySelector(".aa-DetachedSearchButtonIcon");
    if (!holder) return false;

    holder.innerHTML = navbarIcon("search");
    return true;
  };

  if (!updateSearchIcon() && search) {
    const observer = new MutationObserver(() => {
      if (updateSearchIcon()) observer.disconnect();
    });
    observer.observe(search, { childList: true, subtree: true });
  }
};

document.addEventListener("DOMContentLoaded", initializeNavbarIcons);
</script>
