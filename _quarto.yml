project:
  type: website
  output-dir: docs
  resources: 
    - CNAME
    - .nojekyll
    - fonts
    - posts/KNN/knn.webp
    - posts/bitcoin_from_scratch/Bitcoin.webp
    - posts/gepa-deepdive/blogpost_image.webp
    - posts/gepa-impact/gepa_impact.webp
    - posts/micrograd-karpathy/micrograd.webp
    - posts/naive-bayes/naive bayes.webp
    - "!.venv"

website:
  google-analytics: "G-EMRH6XWVFQ"
  description: "Notes on machine learning, foundation models, recommender systems, and production AI."
  site-url: https://risheekkumar.in
  title: "Risheekkumar Baskaran"
  favicon: profile.jpg
  navbar:
    title: "Risheekkumar"
    right:
      - text: Archive
        href: archive.qmd
      - text: Projects
        href: projects.qmd
      - about.qmd
    search: true
  page-footer:
    center: "© 2026 Risheekkumar Baskaran · Built with Quarto"
    border: true

format:
  html:
    theme:
      light:
        - cosmo
        - brand
      dark:
        - darkly
        - brand
    css: styles.css
    smooth-scroll: true
    include-after-body:
      - partials/navbar-icons.html
      - partials/toc-behavior.html

execute:
  freeze: auto
